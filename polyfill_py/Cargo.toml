[package]
name = "polyfill-py"
version = "0.1.0"
edition = "2021"
description = "PyO3 Python bindings for polyfill-rs — high-performance Polymarket CLOB client"

[lib]
name = "polyfill_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
polyfill-rs = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
rust_decimal = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
