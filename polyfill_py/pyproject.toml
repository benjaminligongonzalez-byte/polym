[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "polyfill-py"
version = "0.1.0"
description = "PyO3 bindings for polyfill-rs — high-performance Polymarket CLOB client"
requires-python = ">=3.10"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "polyfill_py"
